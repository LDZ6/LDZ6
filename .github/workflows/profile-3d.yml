name: GitHub-Profile-3D-Contrib

on:
  schedule: # 03:00 JST == 18:00 UTC
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        continue-on-error: false
        
      - name: Change Font to Times New Roman
        run: |
          if ls profile-3d-contrib/*.svg 1> /dev/null 2>&1; then
            sed -i 's/\* { font-family: "Ubuntu", "Helvetica", "Arial", sans-serif; }/text { font-family: "Times New Roman", serif; font-weight: bold; fill: #ffffff; }/g' profile-3d-contrib/*.svg
          else
            echo "No SVG files found, skipping font change"
          fi
          
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git diff --staged --quiet || git commit -m "generated"
          git push
