<svg width="100%" height="300" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@800&amp;display=swap');
      
      .matrix-bg { fill: #0d1117; }
      .matrix-col {
        font-family: 'Courier New', monospace;
        font-size: 14px;
        fill: #0f0;
        opacity: 0.8;
      }
      
      @keyframes fall {
        0% { transform: translateY(-300px); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateY(300px); opacity: 0; }
      }
      
      .col-1 { animation: fall 3s linear infinite; animation-delay: 0s; }
      .col-2 { animation: fall 4s linear infinite; animation-delay: 0.5s; }
      .col-3 { animation: fall 2.5s linear infinite; animation-delay: 1.2s; }
      .col-4 { animation: fall 3.5s linear infinite; animation-delay: 2.1s; }
      .col-5 { animation: fall 5s linear infinite; animation-delay: 0.8s; }
      .col-6 { animation: fall 3.2s linear infinite; animation-delay: 1.5s; }
      .col-7 { animation: fall 4.5s linear infinite; animation-delay: 0.2s; }
      .col-8 { animation: fall 2.8s linear infinite; animation-delay: 2.5s; }
      .col-9 { animation: fall 3.8s linear infinite; animation-delay: 1.8s; }
      .col-10 { animation: fall 4.2s linear infinite; animation-delay: 3.0s; }
      
      .title {
        font-family: 'JetBrains Mono', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size: 48px;
        font-weight: 800;
        fill: #ffffff;
        text-anchor: middle;
        filter: drop-shadow(0 0 10px #0f0);
        animation: glow 2s ease-in-out infinite alternate;
      }
      
      .subtitle {
        font-family: 'Segoe UI', sans-serif;
        font-size: 18px;
        fill: #a2fca2;
        text-anchor: middle;
        letter-spacing: 4px;
        opacity: 0;
        animation: fadeIn 1s ease-out forwards 1s;
      }

      @keyframes glow {
        from { filter: drop-shadow(0 0 5px #0f0); }
        to { filter: drop-shadow(0 0 20px #0f0); }
      }

      @keyframes fadeIn {
        to { opacity: 1; }
      }
      
      .cursor {
        animation: blink 1s step-end infinite;
      }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="matrix-bg" />

  <!-- Matrix Rain Columns -->
  <g transform="translate(40, 0)">
    <text x="0" y="0" class="matrix-col col-1">1 0 1 0 1</text>
    <text x="40" y="-50" class="matrix-col col-5">0 1 1 0 0</text>
    <text x="80" y="-100" class="matrix-col col-2">1 1 0 1 0</text>
    <text x="120" y="0" class="matrix-col col-8">0 0 1 0 1</text>
    <text x="160" y="-80" class="matrix-col col-3">1 0 0 1 1</text>
    <text x="200" y="-150" class="matrix-col col-7">0 1 0 0 0</text>
    <text x="240" y="0" class="matrix-col col-4">1 1 1 1 0</text>
    <text x="280" y="-120" class="matrix-col col-9">0 0 1 1 1</text>
    <text x="320" y="-60" class="matrix-col col-6">1 0 1 0 0</text>
    <text x="360" y="0" class="matrix-col col-1">0 1 0 1 0</text>
    <text x="400" y="-200" class="matrix-col col-10">1 1 0 0 1</text>
    <text x="440" y="0" class="matrix-col col-2">0 0 1 1 0</text>
    <text x="480" y="-40" class="matrix-col col-5">1 0 1 1 1</text>
    <text x="520" y="-90" class="matrix-col col-8">0 1 0 0 0</text>
    <text x="560" y="0" class="matrix-col col-3">1 1 1 0 1</text>
    <text x="600" y="-110" class="matrix-col col-7">0 0 0 1 0</text>
    <text x="640" y="0" class="matrix-col col-4">1 0 1 0 1</text>
    <text x="680" y="-130" class="matrix-col col-9">0 1 1 1 1</text>
    <text x="720" y="-70" class="matrix-col col-6">1 0 0 0 0</text>
    <text x="760" y="0" class="matrix-col col-10">0 0 1 0 1</text>
  </g>
  
  <!-- Content Overlay -->
  <rect x="200" y="80" width="400" height="140" rx="10" fill="#0d1117" opacity="0.9" stroke="#0f0" stroke-width="2" />
  
  <text x="400" y="160" class="title">LDZ<tspan fill="#0f0">6</tspan></text>
  <text x="400" y="195" class="subtitle">GOLANG · AI · WEB<tspan class="cursor">_</tspan></text>

</svg>
