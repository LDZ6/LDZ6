<svg width="100%" height="250" viewBox="0 0 800 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Pixel Dragon Assets -->
    <g id="dragon-body">
       <rect x="40" y="8" width="16" height="16" fill="#2ecc71" />
       <rect x="56" y="12" width="4" height="8" fill="#2ecc71" />
       <rect x="44" y="12" width="4" height="4" fill="#ffffff" />
       <rect x="46" y="14" width="2" height="2" fill="#000000" />
       <rect x="8" y="16" width="32" height="12" fill="#2ecc71" />
       <rect x="16" y="16" width="4" height="4" fill="#27ae60" />
       <rect x="24" y="20" width="4" height="4" fill="#27ae60" />
       <rect x="0" y="12" width="8" height="8" fill="#2ecc71" />
       <rect x="12" y="28" width="8" height="4" fill="#2ecc71" />
       <rect x="28" y="28" width="8" height="4" fill="#2ecc71" />
    </g>
    <g id="dragon-frame-1">
      <use href="#dragon-body" />
      <rect x="16" y="4" width="16" height="8" fill="#2ecc71" />
      <rect x="12" y="0" width="4" height="4" fill="#2ecc71" />
      <rect x="32" y="0" width="4" height="4" fill="#2ecc71" />
    </g>
    <g id="dragon-frame-2">
      <use href="#dragon-body" />
      <rect x="16" y="20" width="16" height="8" fill="#2ecc71" />
      <rect x="12" y="24" width="4" height="4" fill="#2ecc71" />
      <rect x="32" y="24" width="4" height="4" fill="#2ecc71" />
    </g>
    
    <!-- Background Star Removed -->
  </defs>

  <!-- Background Stars Removed -->

  <!-- Central Text Area -->
  <g transform="translate(400, 125)" text-anchor="middle" font-family="'Times New Roman', serif">
    <!-- Line 1: Typewriter effect using CSS mask/clip-path emulation via SVG width animation is complex, 
         so we'll use a simple fade-in or static text. Given the constraints, static text with a nice font is safer for GitHub sanitization,
         but let's try a simple opacity animation. -->
    
    <text x="0" y="-10" font-size="22" font-weight="bold" fill="#33CCFF">
      A curious developer passionate about Artificial Intelligence &amp; Web Development.
    </text>
    <text x="0" y="25" font-size="16" fill="#cccccc">
      Master's student @ University of Chinese Academy of Sciences
    </text>
  </g>

  <!-- Orbiting Dragon -->
  <g>
    <!-- Elliptical Path around the text center (400, 125) -->
    <!-- M center-x-R, center-y  a R,r 0 1,0 2R,0 a R,r 0 1,0 -2R,0 -->
    <!-- Let's make it a bit irregular/organic -->
    <animateMotion 
      dur="12s" 
      repeatCount="indefinite"
      rotate="auto"
      path="M 400,125 m -360,0 a 360,100 0 1,0 720,0 a 360,100 0 1,0 -720,0" />
    
    <!-- Dragon Sprite -->
    <!-- Rotate -90 because automatic rotation assumes object points +X, but our path moves CW/CCW. 
         Let's just position it. The path is CW. Dragon faces right. Perfect. -->
    <g transform="scale(0.8) translate(-32, -16)"> 
        <!-- Simplified to single frame to prevent rendering artifacts (flashing blocks) -->
        <use href="#dragon-frame-1" />
    </g>
  </g>
</svg>
